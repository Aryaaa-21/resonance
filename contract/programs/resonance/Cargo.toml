[package]
name = "resonance"
version = "0.1.0"
description = "Provisional event verification protocol core"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "resonance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
